[package]
name = "opendictate"
version = "2.0.0"
edition = "2021"
authors = ["H. K. Saikia"]
license = "MIT"
description = "Voice dictation and AI speech-to-text application for Linux"
homepage = "https://github.com/hkumarsaikia/OpenDictate"
repository = "https://github.com/hkumarsaikia/OpenDictate"

[dependencies]
relm4 = "0.9"
gtk4 = { version = "0.9", features = ["v4_12"] }
libadwaita = { version = "0.7", features = ["v1_5"] }
tokio = { version = "1.38", features = ["full"] }
async-trait = "0.1"
cpal = "0.15"
hound = "3.5"
rubato = "0.15"
rusqlite = { version = "0.31", features = ["bundled"] }
reqwest = { version = "0.12", features = ["json", "stream", "multipart"] }
eventsource-stream = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
ksni = "0.2"
ashpd = "0.9"
arboard = "3.4"
directories = "5.0"
log = "0.4"
env_logger = "0.11"
local-speech-engine = { package = "whisper-rs", version = "0.16.0" }

[dev-dependencies]
tempfile = "3.10"
