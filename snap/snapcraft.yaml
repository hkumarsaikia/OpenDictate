name: opendictate
version: '2.0.2'
summary: Dictate text with your voice
description: |
  OpenDictate is a desktop voice dictation and speech-to-text application.
  It combines private offline transcription with multi-provider Cloud AI models
  to turn spoken voice into clean, polished text.

license: MIT
source-code: https://github.com/hkumarsaikia/OpenDictate
issues: https://github.com/hkumarsaikia/OpenDictate/issues
website: https://github.com/hkumarsaikia/OpenDictate
icon: src/ui/assets/brand/opendictate.svg

grade: stable
confinement: strict
base: core24

platforms:
  amd64:

apps:
  opendictate:
    command: usr/bin/opendictate
    desktop: usr/share/applications/io.github.hkumarsaikia.OpenDictate.desktop
    common-id: io.github.hkumarsaikia.OpenDictate
    extensions: [ gnome ]
    plugs:
      - audio-record
      - audio-playback
      - network
      - desktop
      - desktop-legacy
      - wayland
      - x11
    environment:
      ALSA_PLUGIN_DIR: $SNAP/usr/lib/x86_64-linux-gnu/alsa-lib
      ALSA_CONFIG_DIR: $SNAP/usr/share/alsa
      ALSA_CONFIG_PATH: $SNAP/usr/share/alsa/alsa.conf
      LD_LIBRARY_PATH: $SNAP/usr/lib/x86_64-linux-gnu/pulseaudio:$SNAP/gnome-platform/usr/lib/x86_64-linux-gnu/pulseaudio

layout:
  /usr/share/alsa:
    bind: $SNAP/gnome-platform/usr/share/alsa
  /usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/alsa-lib:
    bind: $SNAP/usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/alsa-lib

parts:
  opendictate:
    plugin: rust
    source: .
    rust-channel: stable
    build-environment:
      - CARGO_BUILD_RUSTFLAGS: "-C target-cpu=x86-64 -C target-feature=-sse3,-ssse3,-sse4.1,-sse4.2,-avx,-avx2,-fma,-f16c,-bmi1,-bmi2,-lzcnt,-popcnt,-movbe"
      - GGML_NATIVE: "OFF"
      - GGML_SSE42: "OFF"
      - GGML_AVX: "OFF"
      - GGML_AVX2: "OFF"
      - GGML_BMI2: "OFF"
      - GGML_FMA: "OFF"
      - GGML_F16C: "OFF"
      - GGML_AVX_VNNI: "OFF"
      - GGML_AVX512: "OFF"
      - GGML_AVX512_VBMI: "OFF"
      - GGML_AVX512_VNNI: "OFF"
      - GGML_AVX512_BF16: "OFF"
      - GGML_AMX_TILE: "OFF"
      - GGML_AMX_INT8: "OFF"
      - GGML_AMX_BF16: "OFF"
    build-packages:
      - build-essential
      - pkg-config
      - cmake
      - clang
      - libclang-dev
      - libgtk-4-dev
      - libadwaita-1-dev
      - libasound2-dev
      - libdbus-1-dev
      - libssl-dev
    stage-packages:
      - libasound2t64
      - libasound2-data
      - libasound2-plugins
      - pulseaudio-utils
    override-build: |
      unset RUSTFLAGS CARGO_ENCODED_RUSTFLAGS
      craftctl default
      mkdir -p $CRAFT_PART_INSTALL/usr/bin $CRAFT_PART_INSTALL/etc
      if [ -f $CRAFT_PART_INSTALL/bin/opendictate ]; then
        mv $CRAFT_PART_INSTALL/bin/opendictate $CRAFT_PART_INSTALL/usr/bin/opendictate
        rmdir --ignore-fail-on-non-empty $CRAFT_PART_INSTALL/bin || true
      fi
      export PATH="$HOME/.cargo/bin:$PATH"
      env -u RUSTFLAGS -u CARGO_ENCODED_RUSTFLAGS \
      CARGO_BUILD_RUSTFLAGS="-C target-cpu=x86-64 -C target-feature=+sse3,+ssse3,+sse4.1,+sse4.2,+avx,+avx2,+fma,+f16c,+bmi2,-bmi1,-lzcnt,-popcnt,-movbe" \
      GGML_NATIVE=OFF \
      GGML_SSE42=ON \
      GGML_AVX=ON \
      GGML_AVX2=ON \
      GGML_BMI2=ON \
      GGML_FMA=ON \
      GGML_F16C=ON \
      GGML_AVX_VNNI=OFF \
      GGML_AVX512=OFF \
      GGML_AVX512_VBMI=OFF \
      GGML_AVX512_VNNI=OFF \
      GGML_AVX512_BF16=OFF \
      GGML_AMX_TILE=OFF \
      GGML_AMX_INT8=OFF \
      GGML_AMX_BF16=OFF \
      cargo build --release --locked --target-dir target/avx2
      install -Dm755 target/avx2/release/opendictate $CRAFT_PART_INSTALL/usr/bin/opendictate-avx2
      cat << 'EOF' > $CRAFT_PART_INSTALL/etc/asound.conf
      pcm.!default {
          type pulse
          fallback "sysdefault"
          hint {
              show on
              description "Default ALSA Output (currently PulseAudio/PipeWire Sound Server)"
          }
      }
      ctl.!default {
          type pulse
          fallback "sysdefault"
      }
      pcm.pulse {
          type pulse
          hint {
              show on
              description "PulseAudio/PipeWire Sound Server"
          }
      }
      ctl.pulse {
          type pulse
      }
      EOF
      if [ -f $CRAFT_PART_INSTALL/usr/share/alsa/alsa.conf ]; then
        cat $CRAFT_PART_INSTALL/etc/asound.conf >> $CRAFT_PART_INSTALL/usr/share/alsa/alsa.conf
      fi
      install -Dm644 LICENSE $CRAFT_PART_INSTALL/usr/share/licenses/opendictate/LICENSE
      install -Dm644 data/io.github.hkumarsaikia.OpenDictate.desktop $CRAFT_PART_INSTALL/usr/share/applications/io.github.hkumarsaikia.OpenDictate.desktop
      install -Dm644 data/io.github.hkumarsaikia.OpenDictate.metainfo.xml $CRAFT_PART_INSTALL/usr/share/metainfo/io.github.hkumarsaikia.OpenDictate.metainfo.xml
      install -Dm644 src/ui/assets/brand/opendictate.svg $CRAFT_PART_INSTALL/usr/share/icons/hicolor/scalable/apps/io.github.hkumarsaikia.OpenDictate.svg
      install -Dm644 src/ui/assets/brand/opendictate.svg $CRAFT_PART_INSTALL/usr/share/icons/hicolor/scalable/apps/opendictate.svg
      install -Dm644 src/ui/assets/brand/opendictate-dark.svg $CRAFT_PART_INSTALL/usr/share/icons/hicolor/scalable/apps/opendictate-dark.svg
      install -Dm644 src/ui/assets/brand/opendictate-light.svg $CRAFT_PART_INSTALL/usr/share/icons/hicolor/scalable/apps/opendictate-light.svg
      install -Dm644 src/ui/assets/brand/opendictate-dark.svg $CRAFT_PART_INSTALL/usr/share/icons/hicolor/scalable/apps/io.github.hkumarsaikia.OpenDictate-dark.svg
      install -Dm644 src/ui/assets/brand/opendictate-light.svg $CRAFT_PART_INSTALL/usr/share/icons/hicolor/scalable/apps/io.github.hkumarsaikia.OpenDictate-light.svg
      for size in 16x16 24x24 32x32 48x48 64x64 128x128 256x256 512x512; do
        install -Dm644 src/ui/assets/brand/png/${size}.png $CRAFT_PART_INSTALL/usr/share/icons/hicolor/${size}/apps/io.github.hkumarsaikia.OpenDictate.png
        install -Dm644 src/ui/assets/brand/png/${size}.png $CRAFT_PART_INSTALL/usr/share/icons/hicolor/${size}/apps/io.github.hkumarsaikia.OpenDictate-dark.png
        install -Dm644 src/ui/assets/brand/png-light/${size}.png $CRAFT_PART_INSTALL/usr/share/icons/hicolor/${size}/apps/io.github.hkumarsaikia.OpenDictate-light.png
        install -Dm644 src/ui/assets/brand/png/${size}.png $CRAFT_PART_INSTALL/usr/share/icons/hicolor/${size}/apps/opendictate-dark.png
        install -Dm644 src/ui/assets/brand/png-light/${size}.png $CRAFT_PART_INSTALL/usr/share/icons/hicolor/${size}/apps/opendictate-light.png
      done
