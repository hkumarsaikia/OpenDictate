name: opendictate
version: '2.0.0'
summary: Dictate text with your voice
description: |
  OpenDictate is a desktop voice dictation and speech-to-text application.
  It combines private offline transcription with multi-provider Cloud AI models
  to turn spoken voice into clean, polished text.

license: MIT
source-code: https://github.com/hkumarsaikia/OpenDictate
issues: https://github.com/hkumarsaikia/OpenDictate/issues
website: https://github.com/hkumarsaikia/OpenDictate
icon: src/ui/assets/brand/opendictate.svg

grade: stable
confinement: strict
base: core24

platforms:
  amd64: {}
  arm64: {}

apps:
  opendictate:
    command: usr/bin/opendictate
    desktop: usr/share/applications/io.github.opendictate.OpenDictate.desktop
    common-id: io.github.opendictate.OpenDictate
    extensions: [ gnome ]
    plugs:
      - audio-record
      - audio-playback
      - network
      - desktop
      - desktop-legacy
      - wayland
      - x11
    environment:
      ALSA_PLUGIN_DIR: $SNAP/usr/lib/x86_64-linux-gnu/alsa-lib
      ALSA_CONFIG_DIR: $SNAP/usr/share/alsa
      ALSA_CONFIG_PATH: $SNAP/usr/share/alsa/alsa.conf
      LD_LIBRARY_PATH: $SNAP/usr/lib/x86_64-linux-gnu/pulseaudio:$SNAP/gnome-platform/usr/lib/x86_64-linux-gnu/pulseaudio

layout:
  /usr/share/alsa:
    bind: $SNAP/gnome-platform/usr/share/alsa
  /usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/alsa-lib:
    bind: $SNAP/usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/alsa-lib

parts:
  opendictate:
    plugin: rust
    source: .
    rust-channel: stable
    build-environment:
      - GGML_NATIVE: "OFF"
    build-packages:
      - build-essential
      - pkg-config
      - cmake
      - clang
      - libclang-dev
      - libgtk-4-dev
      - libadwaita-1-dev
      - libasound2-dev
      - libdbus-1-dev
      - libssl-dev
    stage-packages:
      - libasound2t64
      - libasound2-data
      - libasound2-plugins
      - pulseaudio-utils
    override-build: |
      craftctl default
      mkdir -p $CRAFT_PART_INSTALL/usr/bin $CRAFT_PART_INSTALL/etc
      if [ -f $CRAFT_PART_INSTALL/bin/opendictate ]; then
        cp $CRAFT_PART_INSTALL/bin/opendictate $CRAFT_PART_INSTALL/usr/bin/opendictate
      fi
      cat << 'EOF' > $CRAFT_PART_INSTALL/etc/asound.conf
      pcm.!default {
          type pulse
          fallback "sysdefault"
          hint {
              show on
              description "Default ALSA Output (currently PulseAudio/PipeWire Sound Server)"
          }
      }
      ctl.!default {
          type pulse
          fallback "sysdefault"
      }
      pcm.pulse {
          type pulse
          hint {
              show on
              description "PulseAudio/PipeWire Sound Server"
          }
      }
      ctl.pulse {
          type pulse
      }
      EOF
      if [ -f $CRAFT_PART_INSTALL/usr/share/alsa/alsa.conf ]; then
        cat $CRAFT_PART_INSTALL/etc/asound.conf >> $CRAFT_PART_INSTALL/usr/share/alsa/alsa.conf
      fi
      install -Dm644 LICENSE $CRAFT_PART_INSTALL/usr/share/licenses/opendictate/LICENSE
      install -Dm644 data/io.github.opendictate.OpenDictate.desktop $CRAFT_PART_INSTALL/usr/share/applications/io.github.opendictate.OpenDictate.desktop
      install -Dm644 data/io.github.opendictate.OpenDictate.metainfo.xml $CRAFT_PART_INSTALL/usr/share/metainfo/io.github.opendictate.OpenDictate.metainfo.xml
      install -Dm644 src/ui/assets/brand/opendictate.svg $CRAFT_PART_INSTALL/usr/share/icons/hicolor/scalable/apps/io.github.opendictate.OpenDictate.svg
      install -Dm644 src/ui/assets/brand/opendictate.svg $CRAFT_PART_INSTALL/usr/share/icons/hicolor/scalable/apps/opendictate.svg
      install -Dm644 src/ui/assets/brand/opendictate-dark.svg $CRAFT_PART_INSTALL/usr/share/icons/hicolor/scalable/apps/opendictate-dark.svg
      install -Dm644 src/ui/assets/brand/opendictate-light.svg $CRAFT_PART_INSTALL/usr/share/icons/hicolor/scalable/apps/opendictate-light.svg
      for size in 16x16 24x24 32x32 48x48 64x64 128x128 256x256 512x512; do
        install -Dm644 src/ui/assets/brand/png/${size}.png $CRAFT_PART_INSTALL/usr/share/icons/hicolor/${size}/apps/io.github.opendictate.OpenDictate.png
        install -Dm644 src/ui/assets/brand/png/${size}.png $CRAFT_PART_INSTALL/usr/share/icons/hicolor/${size}/apps/opendictate-dark.png
        install -Dm644 src/ui/assets/brand/png-light/${size}.png $CRAFT_PART_INSTALL/usr/share/icons/hicolor/${size}/apps/opendictate-light.png
      done
